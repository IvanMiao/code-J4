- id: retro/bg_gate
  model: gemini-3-pro-image
  aspect: '16:9'
  size: 2K
  prompt: 'RPG field map, one continuous scene, no characters: the main gate of a Chinese university, drawn with EXACTLY the same camera as the
    reference image (straight-on high-angle 3/4 view, building fronts face the viewer, horizontal ground lines, NOT diagonal isometric), same
    pixel scale, palette and afternoon light. Top centre: a wide grey stone gate arch facing the viewer, with the four large gold characters
    "江城大学" across its lintel, iron gates open. To the right of the gate a small white guard booth with a small sign "门卫". Below the gate a
    wide open paved plaza in light granite tiles fills the middle of the image, with a stone bench and a lamp post. A broad paved path leaves the
    plaza at the RIGHT edge, at mid height. Plane trees and flower beds along the left edge and the bottom edge.'
  refs:
  - retro/bg_avenue
  post: &bg
  - resize:
      width: 960
      height: 540
  - quantize:
      colors: 128
  out: public/art/retro/bg_gate.png
- id: retro/bg_avenue
  model: gemini-3-pro-image
  aspect: '16:9'
  size: 2K
  prompt: 'RPG field map, one continuous scene, no characters, drawn with EXACTLY the same camera as the reference image (straight-on high-angle
    3/4 view, building fronts face the viewer, horizontal ground lines, NOT diagonal isometric), same pixel scale, palette and afternoon light: a
    tree-lined avenue inside a Chinese university campus. A wide paved avenue runs horizontally across the middle of the image, fully open from
    the LEFT edge to the RIGHT edge: nothing stands on the avenue or overhangs it, and the avenue is completely clear where it meets both edges.
    Across the top, all facing the viewer: a four-storey red-brick student dormitory with an entrance door and steps and a large vertical name
    board beside the door reading "梧桐苑"; to its right a glass-covered notice board titled "公告栏"; further right a small campus shop whose
    shop front, open door and counter face the viewer, with the sign "校园超市" above the door. A strip of sidewalk runs between these buildings
    and the avenue, with a bicycle rack in front of the dorm. Plane trees stand only behind the sidewalk between the buildings and in a row on the
    lawn along the bottom edge, never on the avenue. At the right end of the avenue, on the edge of the sidewalk, a small wooden signpost with an
    arrow pointing right and the characters "图书馆"; at the left end a matching signpost with an arrow pointing left and the characters "校门".
    Lower edge: lawn, low hedges and a bench.'

# Campus demo (retro). Regenerate: npm run gen:art -- --style retro
style: retro
bible: assets/style/bible-campus.md
items:
- id: retro/design_nika
  model: gemini-3-pro-image
  aspect: '16:9'
  prompt: 'Character design sheet: NIKA (placeholder talking cat): an American Shorthair silver tabby-and-white bicolour cat: silver coat with bold
    black classic tabby swirls ("bullseye" on the flanks) on the back, flanks, tail and top of the head; a white blaze up the middle of the face
    between the eyes, pure white muzzle, chin, chest and belly, and four white paws like socks; round face with full cheeks, big copper-amber
    eyes, sturdy muscular body, short thick tail with black rings, calm and slightly superior expression. Show the cat from the front, from the side walking, from the back, sitting, plus a head close-up. Plain flat pure
    chroma-key green background (#00FF00) filling the whole image, no shadow on the ground, no gradient. Give the subject a thin 2px white outline
    so it separates cleanly from the green.'
  post:
  - chromaKey: {}
  out: public/art/retro/design_nika.png
- id: retro/walk_nika
  compose:
  - from: retro/walk_nika_down
  - from: retro/walk_nika_side
    mirror: true
  - from: retro/walk_nika_side
  - from: retro/walk_nika_up
  out: public/art/retro/walk_nika.png
- id: retro/portrait_nika_calm
  model: gemini-3.1-flash-image
  aspect: '1:1'
  prompt: 'Dialogue portrait: head-and-shoulders bust of the silver tabby-and-white American Shorthair cat from the reference design sheet (white blaze, white muzzle and chest), three-quarter view facing
    slightly right, expression: calm, half-lidded copper eyes. Plain flat pure chroma-key green background (#00FF00) filling the whole image, no
    shadow, no gradient. Give the subject a thin 2px white outline so it separates cleanly from the green.'
  refs:
  - retro/design_nika
  post: &portrait
  - chromaKey: {}
  - trim: true
  - resize:
      width: 110
      height: 110
      fit: contain
  - quantize:
      colors: 48
  out: public/art/retro/portrait_nika_calm.png
- id: retro/portrait_nika_smug
  model: gemini-3.1-flash-image
  aspect: '1:1'
  prompt: 'Dialogue portrait: head-and-shoulders bust of the same cat as in the reference portrait, identical design, colours and framing,
    three-quarter view facing slightly right, expression: smug, one eye half-closed, the corner of the mouth curled up. Plain flat pure chroma-key
    green background (#00FF00) filling the whole image, no shadow, no gradient. Give the subject a thin 2px white outline so it separates cleanly
    from the green.'
  refs:

# Ancient line (Pentiment-like woodblock illustration). Regenerate: npm run gen:art -- --style ming
# Placeholder characters and places — names and looks are Yifan's to decide.
style: ming
bible: assets/style/bible-ming.md
items:
- id: ming/walk_shen_side
  raw: assets/raw/ming/walk_shen_side_v2.png
  prompt: 'ASSET: sprite strip for the man in the reference image (the young clerk in the blue-grey robe and black square cap). Redraw THIS SAME man: same face, same costume, same colours, same line weight, same proportions, same woodblock-print drawing manner as the reference crop. Do not restyle him.
    Exactly THREE full-body frames of him in one horizontal row and nothing else, evenly spaced, generous empty space between them, all exactly the same size. ALL THREE frames are in strict SIDE PROFILE walking toward the RIGHT edge of the image: nose, toes and knees point RIGHT, the face is never turned toward the viewer. Frame 1: mid-stride, right leg forward. Frame 2: passing pose, legs together. Frame 3: mid-stride, left leg forward. Feet on one baseline. He keeps the bundle of documents under his arm.
    No grid lines, no labels, no ground, no shadow. Plain flat pure chroma-key green background (#00FF00) filling the whole image, no gradient, no paper texture on the background.'
  refs: [assets/raw/ming/crop_shen_ref.png]
  post:
  - removeGroundLine: true
  - chromaKey: {}
  - sheet:
      cols: 3
      rows: 1
      frameWidth: 180
      frameHeight: 284
      padding: 11
  out: assets/strips/ming_walk_shen_side.png
- id: ming/walk_shen
  compose:
  - from: ming/walk_shen_side
    mirror: true
  - from: ming/walk_shen_side
  out: public/art/ming/walk_shen.png
- id: ming/walk_kuang_side
  raw: assets/raw/ming/walk_kuang_side_v2.png
  prompt: 'ASSET: sprite strip for the man in the reference image (the bald old hermit with the long grey beard, hemp robe and gnarled staff). Redraw THIS SAME man: same face, same costume, same colours, same line weight, same proportions, same woodblock-print drawing manner as the reference crop. Do not restyle him.
    Exactly THREE full-body frames of him in one horizontal row and nothing else, evenly spaced, generous empty space between them, all exactly the same size. ALL THREE frames are in strict SIDE PROFILE walking toward the RIGHT edge of the image: nose, toes and knees point RIGHT, the face is never turned toward the viewer. Frame 1: mid-stride, right leg forward. Frame 2: passing pose, legs together. Frame 3: mid-stride, left leg forward. Feet on one baseline. He walks slowly with the staff in his front hand, the staff tip touching the baseline in every frame.
    No grid lines, no labels, no ground, no shadow. Plain flat pure chroma-key green background (#00FF00) filling the whole image, no gradient, no paper texture on the background.'
  refs: [assets/raw/ming/crop_kuang_ref.png]
  post:
  - removeGroundLine: true
  - chromaKey: {}
  - sheet:
      cols: 3
      rows: 1
      frameWidth: 220
      frameHeight: 272
      padding: 11
      fitHeight: 261
  out: assets/strips/ming_walk_kuang_side.png
- id: ming/walk_kuang
  compose:
  - from: ming/walk_kuang_side
    mirror: true
  - from: ming/walk_kuang_side
  out: public/art/ming/walk_kuang.png
- id: ming/walk_andreas_side
  raw: assets/scenes/ming_canal_street/andreas_walk_raw.png
  model: gemini-3-pro-image
  aspect: '16:9'
  prompt: 'The reference image is Andreas, a European Jesuit scholar in China around 1600, cut from the cleaned Ming canal street panorama. Draw the same person in the same black-ink woodcut linework and flat muted colors, with the same pale face, prominent nose, full brown beard, long purple robe, small book, and tall black square 四方平定巾 / 東坡巾 literati hat. Create exactly THREE full-body frames in one horizontal row and nothing else. Every cell is a strict side profile facing RIGHT: nose, knees, and toes point right; never turn toward the viewer. Make the leg poses clearly different, not near-duplicates: frame 1 has the right/front foot planted a short step ahead while the other trails; frame 2 is a passing pose with knees bent and feet nearly underneath the body; frame 3 reverses the stride with the left/back foot planted a short step ahead and the right/front foot trailing. Keep the stride compact: both shoes stay close together in side view and their combined horizontal span is less than 55% of the body width above the knees; never use a wide split stance. Keep the robe hem parted enough to show the distinct foot placement without changing the robe design. Keep head size, hat, robe silhouette, and height consistent across all cells; all soles share one baseline. No extra views, no labels, no grid, no ground line, no shadow. Use a flat pure chroma-key green background (#00FF00), without texture or gradient.'
  refs: [assets/scenes/ming_canal_street/andreas_painted.png]
  post:
  - removeGroundLine: true
  - chromaKey: {}
  - sheet:
      cols: 3
      rows: 1
      frameWidth: 140
      frameHeight: 240
      fitHeight: 230
  out: assets/strips/ming_walk_andreas_side.png
- id: ming/walk_andreas
  compose:
  - from: ming/walk_andreas_side
    mirror: true
  - from: ming/walk_andreas_side
  out: public/art/ming/walk_andreas.png
